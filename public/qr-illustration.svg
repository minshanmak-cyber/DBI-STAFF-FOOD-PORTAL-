<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Front Card 3D drop shadow -->
    <filter id="card-3d-shadow" x="-20%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#35118F" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <!-- Back Card subtle shadow -->
    <filter id="back-card-shadow" x="-20%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5825BD" flood-opacity="0.09" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFFF" />
      <stop offset="100%" stop-color="#E9E1FA" />
    </linearGradient>

    <linearGradient id="front-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF8FF" />
    </linearGradient>
  </defs>

  <!-- Back tilted lavender card -->
  <rect
    x="42"
    y="56"
    width="168"
    height="168"
    rx="36"
    fill="url(#back-grad)"
    filter="url(#back-card-shadow)"
    transform="rotate(-8 126 140)"
  />

  <!-- Front elevated white card with 3D shadow -->
  <g filter="url(#card-3d-shadow)">
    <rect
      x="68"
      y="64"
      width="168"
      height="168"
      rx="36"
      fill="url(#front-grad)"
      stroke="#ECE7F8"
      stroke-width="1.5"
    />

    <!-- Stylized Modern Purple QR Code -->
    <g fill="#5825BD" stroke="#5825BD">
      <!-- Top-Left Finder Marker -->
      <rect x="95" y="91" width="32" height="32" rx="10" fill="none" stroke-width="6" />
      <rect x="105" y="101" width="12" height="12" rx="3.5" stroke="none" />

      <!-- Top-Right Finder Marker -->
      <rect x="151" y="91" width="32" height="32" rx="10" fill="none" stroke-width="6" />
      <rect x="161" y="101" width="12" height="12" rx="3.5" stroke="none" />

      <!-- Bottom-Left Finder Marker -->
      <rect x="95" y="147" width="32" height="32" rx="10" fill="none" stroke-width="6" />
      <rect x="105" y="157" width="12" height="12" rx="3.5" stroke="none" />

      <!-- Data Dots and Bars -->
      <!-- Colon dots between top finders -->
      <rect x="135" y="97" width="7" height="7" rx="3" stroke="none" />
      <rect x="135" y="110" width="7" height="7" rx="3" stroke="none" />

      <!-- Horizontal bar under top-left -->
      <rect x="95" y="132" width="16" height="7" rx="3.5" stroke="none" />

      <!-- Center cluster -->
      <rect x="134" y="127" width="16" height="16" rx="4" stroke="none" />
      <rect x="156" y="130" width="11" height="7" rx="3" stroke="none" />
      <rect x="172" y="128" width="11" height="7" rx="3" stroke="none" />

      <rect x="136" y="148" width="18" height="7" rx="3.5" stroke="none" />
      <rect x="158" y="143" width="8" height="16" rx="3.5" stroke="none" />
      <rect x="171" y="141" width="12" height="8" rx="3" stroke="none" />

      <!-- Bottom right cluster -->
      <rect x="136" y="161" width="8" height="15" rx="3.5" stroke="none" />
      <rect x="150" y="165" width="16" height="7" rx="3.5" stroke="none" />
      <rect x="171" y="155" width="12" height="18" rx="4" stroke="none" />
    </g>
  </g>

  <!-- Sparks (Top-Right of front card) -->
  <g stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round">
    <line x1="219" y1="47" x2="223" y2="56" />
    <line x1="234" y1="41" x2="235" y2="51" />
    <line x1="247" y1="45" x2="242" y2="54" />
  </g>
</svg>

